# Releases the packages under src/ to nuget.org.
#
# Run it manually from the Actions tab. It defaults to a dry run, which builds, tests, packs and exchanges the
# NuGet trusted-publishing token, then stops before anything irreversible: the tag, the nuget.org push, the
# GitHub release and the bookkeeping pull request. Rehearse with a dry run first, especially on a new repository.
#
# One-off owner setup (see "Releasing" in README.md):
#   1. On nuget.org, add a trusted publishing policy for this repository and the workflow file "release.yml".
#   2. Set the repository variable NUGET_USER to the nuget.org account that owns the policy.
#   3. Allow GitHub Actions to create pull requests (Settings -> Actions -> General), for the bookkeeping pull request.
#
# A run that fails after pushing the tag can simply be re-run: it resumes when the tag holds identical sources,
# and every later step (nuget.org push, GitHub release, bookkeeping branch) skips what already exists.
name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to release as major.minor (for example 1.2). The patch number comes from Nerdbank.GitVersioning."
        required: true
        type: string
      dry_run:
        description: "Rehearse only: build, test, pack and exchange the publishing token, but publish nothing."
        required: true
        type: boolean
        default: true

# One release at a time: concurrent runs would race for the tag and the change-log entries.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOLUTION: Ploch.TemplateLibrary.slnx
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Release ${{ inputs.release_version }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the tag, create the release and the bookkeeping branch
      id-token: write # NuGet trusted publishing exchanges the workflow's OIDC token for a short-lived API key
      pull-requests: write # open the bookkeeping pull request

    steps:
      - name: Validate inputs
        env:
          REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error title=Wrong branch::Releases are cut from main only; this run was started from $REF."
            exit 1
          fi
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::release_version must be major.minor, for example 1.2; got '$RELEASE_VERSION'."
            exit 1
          fi
          if [ -z "$NUGET_USER" ]; then
            echo "::error title=NUGET_USER not set::Set the NUGET_USER repository variable to the nuget.org account that owns the trusted publishing policy."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # Credentials stay in .git/config because this job pushes the tag and the bookkeeping branch.
          persist-credentials: true

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      # Nerdbank.GitVersioning reads version.json from the committed tree, so the release version is committed
      # locally. The commit never leaves the runner; the tag below points at the commit that was built.
      - name: Set release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          dotnet nbgv set-version "$RELEASE_VERSION"
          git add version.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "chore(release): v${RELEASE_VERSION}"
          version=$(dotnet nbgv get-version --variable NuGetPackageVersion)
          echo "nuget=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

          # An existing tag means an earlier run of this release stopped part-way. It is resumed only when the tag
          # holds exactly the sources being built now; any other existing tag is a real version clash.
          if git rev-parse --quiet --verify "refs/tags/v$version" > /dev/null; then
            if git diff --quiet "v$version" HEAD --; then
              echo "::notice title=Resuming release::v$version is already tagged with identical sources; resuming the remaining steps."
              # Build from the tagged commit itself, so the packages' SourceLink points at a commit that exists on GitHub.
              git checkout --quiet --detach "v$version"
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error title=Tag exists::v$version is already tagged with different sources. Merge a change to main or release a new major.minor."
              exit 1
            fi
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $version"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release

      - name: Test
        run: dotnet test "$SOLUTION" --no-build --configuration Release

      - name: Pack
        run: dotnet pack "$SOLUTION" --no-build --configuration Release --output ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: ./artifacts/*
          if-no-files-found: error

      # Runs in dry runs too: a misconfigured trusted-publishing policy is the most likely failure, and it can only
      # be checked from inside this workflow. It runs before the tag, so a failure leaves nothing to clean up.
      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push the release tag
        if: ${{ !inputs.dry_run && steps.version.outputs.tag_exists != 'true' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag --annotate "$TAG" --message "Release $TAG"
          git push origin "$TAG"

      - name: Publish to nuget.org
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for package in ./artifacts/*.nupkg; do
            dotnet nuget push "$package" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
          done

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.nuget }}
        run: |
          shopt -s nullglob
          entries=(change-log/*.md)
          entries=("${entries[@]/change-log\/README.md}")
          {
            echo "## Ploch.TemplateLibrary $VERSION"
            echo
            found=false
            for entry in "${entries[@]}"; do
              [ -n "$entry" ] || continue
              cat "$entry"
              echo
              found=true
            done
            if [ "$found" = false ]; then
              echo "No change-log entries were recorded for this release."
            fi
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The GitHub release $TAG already exists."
          else
            gh release create "$TAG" ./artifacts/* --title "$TAG" --notes-file release-notes.md --verify-tag
          fi

      # Archives the published change-log entries and moves version.json on to the next minor prerelease, through a
      # pull request so that branch protection on main still applies.
      - name: Open the bookkeeping pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          VERSION: ${{ steps.version.outputs.nuget }}
        run: |
          major=${RELEASE_VERSION%%.*}
          minor=${RELEASE_VERSION##*.}
          next="$((10#${major})).$((10#${minor} + 1))-prerelease"
          branch="chore/release-bookkeeping-v${VERSION}"

          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "The bookkeeping branch $branch already exists; open or merge its pull request."
            exit 0
          fi
          git checkout --quiet -b "$branch" "origin/main"
          dotnet nbgv set-version "$next"
          shopt -s nullglob
          entries=(change-log/*.md)
          if [ ${#entries[@]} -gt 0 ]; then
            mkdir -p "change-log/archive/v${VERSION}"
            for entry in "${entries[@]}"; do
              [ "$entry" = "change-log/README.md" ] || git mv "$entry" "change-log/archive/v${VERSION}/"
            done
          fi
          git add version.json change-log
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "chore(release): bookkeeping after v${VERSION}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): bookkeeping after v${VERSION}" \
            --body "Archives the change-log entries published in v${VERSION} and moves version.json to ${next}."
